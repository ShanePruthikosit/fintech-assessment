<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimuVest - Investment Simulation Platform</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141829;
            --bg-card: #1a1f35;
            --accent-green: #00ff88;
            --accent-red: #ff4466;
            --accent-blue: #00d4ff;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0b4;
            --border: #2a3045;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-container {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                var(--bg-primary);
        }

        .header {
            padding: 2rem 3rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 26, 0.9);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.85rem;
        }

        .balance {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 3rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            opacity: 0.5;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-green);
        }

        .portfolio-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric {
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .metric:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.1);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .positive {
            color: var(--accent-green);
        }

        .negative {
            color: var(--accent-red);
        }

        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .stock-item {
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stock-item:hover {
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .stock-item.selected {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .stock-info {
            flex: 1;
        }

        .stock-symbol {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .stock-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stock-price {
            text-align: right;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .change {
            font-size: 0.8rem;
        }

        .trade-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-buy {
            background: var(--accent-green);
            color: var(--bg-primary);
        }

        .btn-buy:hover {
            background: #00dd77;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-sell {
            background: var(--accent-red);
            color: white;
        }

        .btn-sell:hover {
            background: #ff3355;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 68, 102, 0.3);
        }

        .holdings-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .holding-item {
            padding: 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .holding-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .holding-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            font-size: 0.8rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .transaction-type {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.7rem;
        }

        .type-buy {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
        }

        .type-sell {
            background: rgba(255, 68, 102, 0.2);
            color: var(--accent-red);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .error {
            padding: 1rem;
            background: rgba(255, 68, 102, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            color: var(--accent-red);
            margin-bottom: 1rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_BASE = '/api';
        const USER_ID = 'demo_user';

        function App() {
            const [portfolio, setPortfolio] = useState(null);
            const [stocks, setStocks] = useState({});
            const [transactions, setTransactions] = useState([]);
            const [selectedStock, setSelectedStock] = useState(null);
            const [quantity, setQuantity] = useState(1);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                initializeUser();
                loadMarketData();
                loadPortfolio();
                loadTransactions();

                // Refresh data every 5 seconds
                const interval = setInterval(() => {
                    loadMarketData();
                    loadPortfolio();
                }, 5000);

                return () => clearInterval(interval);
            }, []);

            const initializeUser = async () => {
                try {
                    await fetch(`${API_BASE}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: USER_ID, initialCapital: 100000 })
                    });
                } catch (err) {
                    // User might already exist
                }
            };

            const loadMarketData = async () => {
                try {
                    const res = await fetch(`${API_BASE}/market/stocks`);
                    const data = await res.json();
                    setStocks(data.stocks);
                    setLoading(false);
                } catch (err) {
                    setError('Failed to load market data');
                    setLoading(false);
                }
            };

            const loadPortfolio = async () => {
                try {
                    const res = await fetch(`${API_BASE}/portfolio/${USER_ID}`);
                    const data = await res.json();
                    setPortfolio(data);
                } catch (err) {
                    setError('Failed to load portfolio');
                }
            };

            const loadTransactions = async () => {
                try {
                    const res = await fetch(`${API_BASE}/transactions/${USER_ID}`);
                    const data = await res.json();
                    setTransactions(data.transactions);
                } catch (err) {
                    console.error('Failed to load transactions');
                }
            };

            const executeTrade = async (type) => {
                if (!selectedStock) {
                    setError('Please select a stock');
                    return;
                }

                if (quantity < 1) {
                    setError('Quantity must be at least 1');
                    return;
                }

                try {
                    setError(null);
                    const res = await fetch(`${API_BASE}/trade`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: USER_ID,
                            symbol: selectedStock,
                            type: type,
                            quantity: parseInt(quantity),
                            orderType: 'MARKET'
                        })
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.detail);
                    }

                    // Refresh data
                    await loadPortfolio();
                    await loadTransactions();
                    setQuantity(1);
                } catch (err) {
                    setError(err.message);
                }
            };

            if (loading) {
                return (
                    <div className="app-container">
                        <div className="loading pulse">Loading SimuVest...</div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="logo">SIMUVEST</div>
                        <div className="user-info">
                            <div className="balance">
                                Cash: ${portfolio?.currentCash?.toFixed(2) || '0.00'}
                            </div>
                            <div className="balance">
                                Total: ${portfolio?.totalValue?.toFixed(2) || '0.00'}
                            </div>
                        </div>
                    </header>

                    <main className="main-content">
                        <div>
                            {/* Portfolio Metrics */}
                            <div className="section">
                                <h2 className="section-title">Portfolio Overview</h2>
                                <div className="portfolio-metrics">
                                    <div className="metric">
                                        <div className="metric-label">Total Value</div>
                                        <div className="metric-value">
                                            ${portfolio?.totalValue?.toFixed(2) || '0.00'}
                                        </div>
                                    </div>
                                    <div className="metric">
                                        <div className="metric-label">Total Gain/Loss</div>
                                        <div className={`metric-value ${portfolio?.totalGainLoss >= 0 ? 'positive' : 'negative'}`}>
                                            ${portfolio?.totalGainLoss?.toFixed(2) || '0.00'}
                                            {portfolio && ` (${portfolio.totalGainLossPct?.toFixed(2)}%)`}
                                        </div>
                                    </div>
                                    <div className="metric">
                                        <div className="metric-label">Available Cash</div>
                                        <div className="metric-value">
                                            ${portfolio?.currentCash?.toFixed(2) || '0.00'}
                                        </div>
                                    </div>
                                    <div className="metric">
                                        <div className="metric-label">Holdings</div>
                                        <div className="metric-value">
                                            {portfolio?.holdings?.length || 0} Stocks
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Holdings */}
                            <div className="section" style={{marginTop: '2rem'}}>
                                <h2 className="section-title">Current Holdings</h2>
                                <div className="holdings-list">
                                    {portfolio?.holdings?.length > 0 ? (
                                        portfolio.holdings.map(holding => (
                                            <div key={holding.symbol} className="holding-item">
                                                <div className="holding-header">
                                                    <div>
                                                        <div className="stock-symbol">{holding.symbol}</div>
                                                        <div className="stock-name">{holding.name}</div>
                                                    </div>
                                                    <div className={`metric-value ${holding.gainLoss >= 0 ? 'positive' : 'negative'}`}>
                                                        ${holding.currentValue?.toFixed(2)}
                                                    </div>
                                                </div>
                                                <div className="holding-details">
                                                    <div className="detail-item">
                                                        <span className="detail-label">Quantity</span>
                                                        <span>{holding.quantity}</span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">Avg Cost</span>
                                                        <span>${holding.averageCost?.toFixed(2)}</span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">Current Price</span>
                                                        <span>${holding.currentPrice?.toFixed(2)}</span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">P&L</span>
                                                        <span className={holding.gainLoss >= 0 ? 'positive' : 'negative'}>
                                                            ${holding.gainLoss?.toFixed(2)}
                                                        </span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">P&L %</span>
                                                        <span className={holding.gainLossPct >= 0 ? 'positive' : 'negative'}>
                                                            {holding.gainLossPct?.toFixed(2)}%
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div style={{textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem'}}>
                                            No holdings yet. Start trading to build your portfolio!
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Recent Transactions */}
                            <div className="section" style={{marginTop: '2rem'}}>
                                <h2 className="section-title">Recent Transactions</h2>
                                <div className="transactions-list">
                                    {transactions.length > 0 ? (
                                        transactions.map(tx => (
                                            <div key={tx.transactionId} className="transaction-item">
                                                <div>
                                                    <span className={`transaction-type ${tx.type === 'BUY' ? 'type-buy' : 'type-sell'}`}>
                                                        {tx.type}
                                                    </span>
                                                    <span style={{marginLeft: '0.75rem', fontWeight: 700}}>
                                                        {tx.symbol}
                                                    </span>
                                                    <span style={{marginLeft: '0.5rem', color: 'var(--text-secondary)'}}>
                                                        ×{tx.quantity}
                                                    </span>
                                                </div>
                                                <div>
                                                    ${tx.price?.toFixed(2)}
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div style={{textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem'}}>
                                            No transactions yet
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Trading Panel */}
                        <div>
                            <div className="section">
                                <h2 className="section-title">Market</h2>
                                <div className="stock-list">
                                    {Object.entries(stocks).map(([symbol, data]) => (
                                        <div 
                                            key={symbol}
                                            className={`stock-item ${selectedStock === symbol ? 'selected' : ''}`}
                                            onClick={() => setSelectedStock(symbol)}
                                        >
                                            <div className="stock-info">
                                                <div className="stock-symbol">{symbol}</div>
                                                <div className="stock-name">{data.name}</div>
                                            </div>
                                            <div className="stock-price">
                                                <div className="price">${data.price?.toFixed(2)}</div>
                                                <div className={`change ${data.change >= 0 ? 'positive' : 'negative'}`}>
                                                    {data.change >= 0 ? '+' : ''}{data.change?.toFixed(2)}%
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="section" style={{marginTop: '2rem'}}>
                                <h2 className="section-title">Place Order</h2>
                                {error && <div className="error">{error}</div>}
                                <div className="trade-form">
                                    <div className="form-group">
                                        <label className="form-label">Selected Stock</label>
                                        <input 
                                            type="text" 
                                            className="form-input"
                                            value={selectedStock || 'None'}
                                            readOnly
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Quantity</label>
                                        <input 
                                            type="number" 
                                            className="form-input"
                                            value={quantity}
                                            onChange={(e) => setQuantity(e.target.value)}
                                            min="1"
                                        />
                                    </div>
                                    {selectedStock && (
                                        <div className="form-group">
                                            <label className="form-label">Est. Total</label>
                                            <input 
                                                type="text" 
                                                className="form-input"
                                                value={`$${(stocks[selectedStock]?.price * quantity).toFixed(2)}`}
                                                readOnly
                                            />
                                        </div>
                                    )}
                                    <div className="button-group">
                                        <button 
                                            className="btn btn-buy"
                                            onClick={() => executeTrade('BUY')}
                                        >
                                            Buy
                                        </button>
                                        <button 
                                            className="btn btn-sell"
                                            onClick={() => executeTrade('SELL')}
                                        >
                                            Sell
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
