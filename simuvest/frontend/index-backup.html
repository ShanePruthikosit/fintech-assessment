<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimuVest - Advanced Investment Simulation</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141829;
            --bg-card: #1a1f35;
            --bg-elevated: #222842;
            --accent-green: #00ff88;
            --accent-red: #ff4466;
            --accent-blue: #00d4ff;
            --accent-yellow: #ffaa00;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0b4;
            --border: #2a3045;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-container {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                var(--bg-primary);
        }

        /* Header */
        .header {
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 26, 0.95);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .header-stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .header-stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 1rem;
            padding: 0 3rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .nav-tab {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(0, 255, 136, 0.05);
        }

        .nav-tab.active {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        /* Main Content */
        .main-content {
            padding: 2rem 3rem;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
            box-shadow: 0 8px 30px var(--shadow);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .metric-change {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Charts */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
        }

        /* Trading Section */
        .trading-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            opacity: 0.5;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-green);
        }

        /* Stock List */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .stock-item {
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stock-item:hover {
            border-color: var(--accent-blue);
            transform: translateX(4px);
            box-shadow: 0 4px 20px var(--shadow);
        }

        .stock-item.selected {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .stock-info {
            flex: 1;
        }

        .stock-symbol {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .stock-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stock-price {
            text-align: right;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .change {
            font-size: 0.8rem;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        /* Trade Form */
        .trade-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-buy {
            background: var(--accent-green);
            color: var(--bg-primary);
        }

        .btn-buy:hover:not(:disabled) {
            background: #00dd77;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-sell {
            background: var(--accent-red);
            color: white;
        }

        .btn-sell:hover:not(:disabled) {
            background: #ff3355;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 68, 102, 0.3);
        }

        /* Holdings */
        .holdings-grid {
            display: grid;
            gap: 1rem;
        }

        .holding-card {
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .holding-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .holding-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .holding-symbol {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .holding-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .holding-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* Transactions */
        .transaction-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-green);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-green);
            color: var(--bg-primary);
            border-color: var(--accent-green);
        }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
        }

        .transactions-table th {
            text-align: left;
            padding: 1rem;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }

        .transactions-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .transactions-table tr:hover {
            background: var(--bg-elevated);
        }

        .transaction-type {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .type-buy {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
        }

        .type-sell {
            background: rgba(255, 68, 102, 0.2);
            color: var(--accent-red);
        }

        /* Order Confirmation Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px var(--shadow);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .modal-content {
            margin-bottom: 2rem;
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .modal-label {
            color: var(--text-secondary);
        }

        .modal-value {
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-cancel {
            flex: 1;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background: var(--bg-elevated);
            border-color: var(--accent-red);
        }

        .btn-confirm {
            flex: 1;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent-green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error/Success Messages */
        .message {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease;
        }

        .message.error {
            background: rgba(255, 68, 102, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        .message.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .trading-layout {
                grid-template-columns: 1fr;
            }
            
            .holding-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = '/api';
        const USER_ID = 'demo_user';

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [portfolio, setPortfolio] = useState(null);
            const [stocks, setStocks] = useState({});
            const [transactions, setTransactions] = useState([]);
            const [selectedStock, setSelectedStock] = useState(null);
            const [quantity, setQuantity] = useState(1);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [pendingTrade, setPendingTrade] = useState(null);
            const [transactionFilter, setTransactionFilter] = useState('ALL');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                initializeUser();
                loadMarketData();
                loadPortfolio();
                loadTransactions();

                const interval = setInterval(() => {
                    loadMarketData();
                    loadPortfolio();
                }, 5000);

                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (activeTab === 'dashboard' && portfolio && transactions.length > 0) {
                    renderChart();
                }
            }, [activeTab, portfolio, transactions]);

            const initializeUser = async () => {
                try {
                    await fetch(`${API_BASE}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: USER_ID, initialCapital: 100000 })
                    });
                } catch (err) {
                    // User might already exist
                }
            };

            const loadMarketData = async () => {
                try {
                    const res = await fetch(`${API_BASE}/market/stocks`);
                    const data = await res.json();
                    setStocks(data.stocks);
                    setLoading(false);
                } catch (err) {
                    setError('Failed to load market data');
                    setLoading(false);
                }
            };

            const loadPortfolio = async () => {
                try {
                    const res = await fetch(`${API_BASE}/portfolio/${USER_ID}`);
                    const data = await res.json();
                    setPortfolio(data);
                } catch (err) {
                    setError('Failed to load portfolio');
                }
            };

            const loadTransactions = async () => {
                try {
                    const res = await fetch(`${API_BASE}/transactions/${USER_ID}?limit=50`);
                    const data = await res.json();
                    setTransactions(data.transactions);
                } catch (err) {
                    console.error('Failed to load transactions');
                }
            };

            const openConfirmModal = (type) => {
                if (!selectedStock) {
                    setError('Please select a stock');
                    setTimeout(() => setError(null), 3000);
                    return;
                }

                if (quantity < 1) {
                    setError('Quantity must be at least 1');
                    setTimeout(() => setError(null), 3000);
                    return;
                }

                setPendingTrade({
                    type,
                    symbol: selectedStock,
                    quantity: parseInt(quantity),
                    price: stocks[selectedStock]?.price,
                    total: stocks[selectedStock]?.price * parseInt(quantity)
                });
                setShowConfirmModal(true);
            };

            const executeTrade = async () => {
                try {
                    setError(null);
                    setShowConfirmModal(false);
                    
                    const res = await fetch(`${API_BASE}/trade`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: USER_ID,
                            symbol: pendingTrade.symbol,
                            type: pendingTrade.type,
                            quantity: pendingTrade.quantity,
                            orderType: 'MARKET'
                        })
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.detail);
                    }

                    setSuccess(`${pendingTrade.type} order executed successfully!`);
                    setTimeout(() => setSuccess(null), 3000);
                    
                    await loadPortfolio();
                    await loadTransactions();
                    setQuantity(1);
                    setPendingTrade(null);
                } catch (err) {
                    setError(err.message);
                    setTimeout(() => setError(null), 5000);
                }
            };

            const renderChart = () => {
                if (!chartRef.current || !portfolio || transactions.length === 0) return;

                // Destroy existing chart
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                // Calculate portfolio value over time from transactions
                let cashBalance = portfolio.currentCash;
                const holdings = {};
                
                // Process transactions in reverse to build history
                const history = [...transactions].reverse().map(tx => {
                    const date = new Date(tx.timestamp).toLocaleDateString();
                    
                    if (tx.type === 'BUY') {
                        cashBalance += tx.price * tx.quantity;
                        holdings[tx.symbol] = (holdings[tx.symbol] || 0) - tx.quantity;
                    } else {
                        cashBalance -= tx.price * tx.quantity;
                        holdings[tx.symbol] = (holdings[tx.symbol] || 0) + tx.quantity;
                    }
                    
                    let holdingsValue = 0;
                    Object.entries(holdings).forEach(([symbol, qty]) => {
                        if (qty > 0 && stocks[symbol]) {
                            holdingsValue += qty * stocks[symbol].price;
                        }
                    });
                    
                    return {
                        date,
                        value: cashBalance + holdingsValue
                    };
                });

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: history.map(h => h.date),
                        datasets: [{
                            label: 'Portfolio Value',
                            data: history.map(h => h.value),
                            borderColor: '#00ff88',
                            backgroundColor: 'rgba(0, 255, 136, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false,
                                ticks: {
                                    color: '#9aa0b4',
                                    callback: function(value) {
                                        return '$' + value.toLocaleString();
                                    }
                                },
                                grid: {
                                    color: '#2a3045'
                                }
                            },
                            x: {
                                ticks: {
                                    color: '#9aa0b4'
                                },
                                grid: {
                                    color: '#2a3045'
                                }
                            }
                        }
                    }
                });
            };

            const filteredTransactions = transactionFilter === 'ALL' 
                ? transactions 
                : transactions.filter(tx => tx.type === transactionFilter);

            if (loading) {
                return (
                    <div className="app-container">
                        <div className="loading">
                            <div className="spinner"></div>
                            Loading SimuVest...
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="header">
                        <div className="logo">SIMUVEST</div>
                        <div className="header-stats">
                            <div className="header-stat">
                                <div className="header-stat-label">Cash</div>
                                <div className="header-stat-value">
                                    ${portfolio?.currentCash?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}
                                </div>
                            </div>
                            <div className="header-stat">
                                <div className="header-stat-label">Total Value</div>
                                <div className="header-stat-value">
                                    ${portfolio?.totalValue?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}
                                </div>
                            </div>
                            <div className="header-stat">
                                <div className="header-stat-label">Total P&L</div>
                                <div className={`header-stat-value ${portfolio?.totalGainLoss >= 0 ? 'positive' : 'negative'}`}>
                                    ${portfolio?.totalGainLoss?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="nav-tabs">
                        <button 
                            className={`nav-tab ${activeTab === 'dashboard' ? 'active' : ''}`}
                            onClick={() => setActiveTab('dashboard')}
                        >
                            Dashboard
                        </button>
                        <button 
                            className={`nav-tab ${activeTab === 'trading' ? 'active' : ''}`}
                            onClick={() => setActiveTab('trading')}
                        >
                            Trading
                        </button>
                        <button 
                            className={`nav-tab ${activeTab === 'holdings' ? 'active' : ''}`}
                            onClick={() => setActiveTab('holdings')}
                        >
                            Holdings
                        </button>
                        <button 
                            className={`nav-tab ${activeTab === 'transactions' ? 'active' : ''}`}
                            onClick={() => setActiveTab('transactions')}
                        >
                            Transactions
                        </button>
                    </nav>

                    {/* Main Content */}
                    <main className="main-content">
                        {/* Dashboard */}
                        <div className={`content-section ${activeTab === 'dashboard' ? 'active' : ''}`}>
                            <div className="dashboard-grid">
                                <div className="metric-card">
                                    <div className="metric-label">Total Value</div>
                                    <div className="metric-value">
                                        ${portfolio?.totalValue?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}
                                    </div>
                                    <div className={`metric-change ${portfolio?.totalGainLoss >= 0 ? 'positive' : 'negative'}`}>
                                        {portfolio?.totalGainLoss >= 0 ? '▲' : '▼'} 
                                        {portfolio?.totalGainLossPct?.toFixed(2)}%
                                    </div>
                                </div>
                                <div className="metric-card">
                                    <div className="metric-label">Cash Balance</div>
                                    <div className="metric-value">
                                        ${portfolio?.currentCash?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}
                                    </div>
                                    <div className="metric-change">
                                        Available for trading
                                    </div>
                                </div>
                                <div className="metric-card">
                                    <div className="metric-label">Total Gain/Loss</div>
                                    <div className={`metric-value ${portfolio?.totalGainLoss >= 0 ? 'positive' : 'negative'}`}>
                                        ${portfolio?.totalGainLoss?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}
                                    </div>
                                    <div className={`metric-change ${portfolio?.totalGainLoss >= 0 ? 'positive' : 'negative'}`}>
                                        {portfolio?.totalGainLossPct?.toFixed(2)}% return
                                    </div>
                                </div>
                                <div className="metric-card">
                                    <div className="metric-label">Holdings</div>
                                    <div className="metric-value">
                                        {portfolio?.holdings?.length || 0}
                                    </div>
                                    <div className="metric-change">
                                        Active positions
                                    </div>
                                </div>
                            </div>

                            {/* Portfolio Chart */}
                            <div className="chart-container">
                                <div className="chart-title">Portfolio Performance</div>
                                <div style={{height: '300px', position: 'relative'}}>
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            </div>

                            {/* Recent Holdings */}
                            <div className="section">
                                <div className="section-title">Top Holdings</div>
                                <div className="holdings-grid">
                                    {portfolio?.holdings?.slice(0, 5).map(holding => (
                                        <div key={holding.symbol} className="holding-card">
                                            <div className="holding-header">
                                                <div>
                                                    <div className="holding-symbol">{holding.symbol}</div>
                                                    <div className="stock-name">{holding.name}</div>
                                                </div>
                                                <div className={`holding-value ${holding.gainLoss >= 0 ? 'positive' : 'negative'}`}>
                                                    ${holding.currentValue?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                </div>
                                            </div>
                                            <div className="holding-details">
                                                <div className="detail-item">
                                                    <span className="detail-label">Shares</span>
                                                    <span className="detail-value">{holding.quantity}</span>
                                                </div>
                                                <div className="detail-item">
                                                    <span className="detail-label">Avg Cost</span>
                                                    <span className="detail-value">${holding.averageCost?.toFixed(2)}</span>
                                                </div>
                                                <div className="detail-item">
                                                    <span className="detail-label">P&L</span>
                                                    <span className={`detail-value ${holding.gainLoss >= 0 ? 'positive' : 'negative'}`}>
                                                        ${holding.gainLoss?.toFixed(2)}
                                                    </span>
                                                </div>
                                                <div className="detail-item">
                                                    <span className="detail-label">P&L %</span>
                                                    <span className={`detail-value ${holding.gainLossPct >= 0 ? 'positive' : 'negative'}`}>
                                                        {holding.gainLossPct?.toFixed(2)}%
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    )) || (
                                        <div className="empty-state">
                                            <div className="empty-icon">📊</div>
                                            <div>No holdings yet. Start trading to build your portfolio!</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Trading */}
                        <div className={`content-section ${activeTab === 'trading' ? 'active' : ''}`}>
                            {error && <div className="message error">{error}</div>}
                            {success && <div className="message success">{success}</div>}
                            
                            <div className="trading-layout">
                                <div className="section">
                                    <div className="section-title">Market</div>
                                    <div className="stock-list">
                                        {Object.entries(stocks).map(([symbol, data]) => (
                                            <div 
                                                key={symbol}
                                                className={`stock-item ${selectedStock === symbol ? 'selected' : ''}`}
                                                onClick={() => setSelectedStock(symbol)}
                                            >
                                                <div className="stock-info">
                                                    <div className="stock-symbol">{symbol}</div>
                                                    <div className="stock-name">{data.name}</div>
                                                </div>
                                                <div className="stock-price">
                                                    <div className="price">${data.price?.toFixed(2)}</div>
                                                    <div className={`change ${data.change >= 0 ? 'positive' : 'negative'}`}>
                                                        {data.change >= 0 ? '+' : ''}{data.change?.toFixed(2)}%
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="section">
                                    <div className="section-title">Place Order</div>
                                    <div className="trade-form">
                                        <div className="form-group">
                                            <label className="form-label">Selected Stock</label>
                                            <input 
                                                type="text" 
                                                className="form-input"
                                                value={selectedStock || 'None'}
                                                readOnly
                                            />
                                        </div>
                                        {selectedStock && (
                                            <>
                                                <div className="form-group">
                                                    <label className="form-label">Current Price</label>
                                                    <input 
                                                        type="text" 
                                                        className="form-input"
                                                        value={`$${stocks[selectedStock]?.price?.toFixed(2)}`}
                                                        readOnly
                                                    />
                                                </div>
                                                <div className="form-group">
                                                    <label className="form-label">Quantity</label>
                                                    <input 
                                                        type="number" 
                                                        className="form-input"
                                                        value={quantity}
                                                        onChange={(e) => setQuantity(e.target.value)}
                                                        min="1"
                                                    />
                                                </div>
                                                <div className="form-group">
                                                    <label className="form-label">Est. Total</label>
                                                    <input 
                                                        type="text" 
                                                        className="form-input"
                                                        value={`$${(stocks[selectedStock]?.price * quantity).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`}
                                                        readOnly
                                                    />
                                                </div>
                                            </>
                                        )}
                                        <div className="button-group">
                                            <button 
                                                className="btn btn-buy"
                                                onClick={() => openConfirmModal('BUY')}
                                                disabled={!selectedStock}
                                            >
                                                Buy
                                            </button>
                                            <button 
                                                className="btn btn-sell"
                                                onClick={() => openConfirmModal('SELL')}
                                                disabled={!selectedStock}
                                            >
                                                Sell
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Holdings */}
                        <div className={`content-section ${activeTab === 'holdings' ? 'active' : ''}`}>
                            <div className="section">
                                <div className="section-title">All Holdings</div>
                                <div className="holdings-grid">
                                    {portfolio?.holdings?.length > 0 ? (
                                        portfolio.holdings.map(holding => (
                                            <div key={holding.symbol} className="holding-card">
                                                <div className="holding-header">
                                                    <div>
                                                        <div className="holding-symbol">{holding.symbol}</div>
                                                        <div className="stock-name">{holding.name}</div>
                                                    </div>
                                                    <div className={`holding-value ${holding.gainLoss >= 0 ? 'positive' : 'negative'}`}>
                                                        ${holding.currentValue?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                    </div>
                                                </div>
                                                <div className="holding-details">
                                                    <div className="detail-item">
                                                        <span className="detail-label">Quantity</span>
                                                        <span className="detail-value">{holding.quantity}</span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">Avg Cost</span>
                                                        <span className="detail-value">${holding.averageCost?.toFixed(2)}</span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">Current Price</span>
                                                        <span className="detail-value">${holding.currentPrice?.toFixed(2)}</span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">Total Cost</span>
                                                        <span className="detail-value">
                                                            ${(holding.quantity * holding.averageCost).toFixed(2)}
                                                        </span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">P&L</span>
                                                        <span className={`detail-value ${holding.gainLoss >= 0 ? 'positive' : 'negative'}`}>
                                                            ${holding.gainLoss?.toFixed(2)}
                                                        </span>
                                                    </div>
                                                    <div className="detail-item">
                                                        <span className="detail-label">P&L %</span>
                                                        <span className={`detail-value ${holding.gainLossPct >= 0 ? 'positive' : 'negative'}`}>
                                                            {holding.gainLossPct?.toFixed(2)}%
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="empty-state">
                                            <div className="empty-icon">📦</div>
                                            <div>No holdings yet. Visit the Trading tab to start investing!</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Transactions */}
                        <div className={`content-section ${activeTab === 'transactions' ? 'active' : ''}`}>
                            <div className="section">
                                <div className="section-title">Transaction History</div>
                                
                                <div className="transaction-filters">
                                    <button 
                                        className={`filter-btn ${transactionFilter === 'ALL' ? 'active' : ''}`}
                                        onClick={() => setTransactionFilter('ALL')}
                                    >
                                        All ({transactions.length})
                                    </button>
                                    <button 
                                        className={`filter-btn ${transactionFilter === 'BUY' ? 'active' : ''}`}
                                        onClick={() => setTransactionFilter('BUY')}
                                    >
                                        Buy ({transactions.filter(tx => tx.type === 'BUY').length})
                                    </button>
                                    <button 
                                        className={`filter-btn ${transactionFilter === 'SELL' ? 'active' : ''}`}
                                        onClick={() => setTransactionFilter('SELL')}
                                    >
                                        Sell ({transactions.filter(tx => tx.type === 'SELL').length})
                                    </button>
                                </div>

                                {filteredTransactions.length > 0 ? (
                                    <table className="transactions-table">
                                        <thead>
                                            <tr>
                                                <th>Date & Time</th>
                                                <th>Type</th>
                                                <th>Symbol</th>
                                                <th>Quantity</th>
                                                <th>Price</th>
                                                <th>Total</th>
                                                <th>ID</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredTransactions.map(tx => (
                                                <tr key={tx.transactionId}>
                                                    <td>{new Date(tx.timestamp).toLocaleString()}</td>
                                                    <td>
                                                        <span className={`transaction-type ${tx.type === 'BUY' ? 'type-buy' : 'type-sell'}`}>
                                                            {tx.type}
                                                        </span>
                                                    </td>
                                                    <td><strong>{tx.symbol}</strong></td>
                                                    <td>{tx.quantity}</td>
                                                    <td>${tx.price?.toFixed(2)}</td>
                                                    <td className={tx.type === 'BUY' ? 'negative' : 'positive'}>
                                                        {tx.type === 'BUY' ? '-' : '+'}
                                                        ${(tx.price * tx.quantity).toFixed(2)}
                                                    </td>
                                                    <td style={{fontSize: '0.75rem', color: 'var(--text-secondary)'}}>
                                                        {tx.transactionId.substring(0, 8)}...
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                ) : (
                                    <div className="empty-state">
                                        <div className="empty-icon">📋</div>
                                        <div>No transactions yet. Start trading to see your history!</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* Order Confirmation Modal */}
                    {showConfirmModal && pendingTrade && (
                        <div className="modal-overlay" onClick={() => setShowConfirmModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">
                                    Confirm {pendingTrade.type} Order
                                </div>
                                <div className="modal-content">
                                    <div className="modal-row">
                                        <span className="modal-label">Symbol</span>
                                        <span className="modal-value">{pendingTrade.symbol}</span>
                                    </div>
                                    <div className="modal-row">
                                        <span className="modal-label">Type</span>
                                        <span className="modal-value">{pendingTrade.type}</span>
                                    </div>
                                    <div className="modal-row">
                                        <span className="modal-label">Quantity</span>
                                        <span className="modal-value">{pendingTrade.quantity} shares</span>
                                    </div>
                                    <div className="modal-row">
                                        <span className="modal-label">Price</span>
                                        <span className="modal-value">${pendingTrade.price?.toFixed(2)}</span>
                                    </div>
                                    <div className="modal-row">
                                        <span className="modal-label">Total</span>
                                        <span className="modal-value" style={{fontSize: '1.2rem', color: 'var(--accent-green)'}}>
                                            ${pendingTrade.total?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                        </span>
                                    </div>
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-cancel" onClick={() => setShowConfirmModal(false)}>
                                        Cancel
                                    </button>
                                    <button 
                                        className={`btn ${pendingTrade.type === 'BUY' ? 'btn-buy' : 'btn-sell'} btn-confirm`}
                                        onClick={executeTrade}
                                    >
                                        Confirm {pendingTrade.type}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
